name: Inventory CICD pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'inventory/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout the code
        uses: actions/checkout@v5

      - name: setup the java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: build and test
        working-directory: inventory
        run: ./gradlew build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: inventory
        run: docker build -t csaikiran/inventoryhub-inventory-service:latest .

      - name: Push Docker image
        run: docker push csaikiran/inventoryhub-inventory-service:latest

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
        script: |
          docker pull $DOCKER_USERNAME/inventoryhub-inventory-service:latest
          docker stop inventory-service || true
          docker rm inventory-service || true
          docker run -d --name inventory-service $DOCKER_USERNAME/inventoryhub-inventory-service:latest

