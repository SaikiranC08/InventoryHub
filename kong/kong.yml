_format_version: "3.0"

consumers:
  - username: inventoryhub-user
    jwt_secrets:
      - key: inventoryhub-auth
        algorithm: HS256
        secret: b1946ac92492d2347c6235b4d2611184c0a6e8a4e5d4f12e45c8c8bfb3e3aefd

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Content-Length
        - Accept
        - Accept-Language
        - Accept-Encoding
        - X-Requested-With
        - X-Business-Id
        - X-User-Id
        - X-Username
        - Idempotency-Key
      exposed_headers:
        - Authorization
        - X-Business-Id
        - X-User-Id
        - X-Username
      credentials: true
      max_age: 3600
      preflight_continue: false

services:
  - name: inventory-service
    url: http://inventory-service:8080
    routes:
      - name: inventory-route
        paths:
          - /api/v1
          - /ws
        strip_path: false


    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          key_claim_name: iss
          secret_is_base64: true
          run_on_preflight: false
          uri_param_names:
            - jwt




      - name: pre-function
        config:
          access:
            - |
              local token
              local auth_header = kong.request.get_header("authorization")
              if auth_header then
                token = auth_header:gsub("Bearer ", "")
              else
                token = kong.request.get_query_arg("jwt")
              end
              if token then
                local parts = {}

                for part in token:gmatch("[^.]+") do
                  table.insert(parts, part)
                end
                if parts[2] then
                  local payload = parts[2]
                  -- pad base64 if needed
                  local padding = 4 - (#payload % 4)
                  if padding < 4 then
                    payload = payload .. string.rep("=", padding)
                  end
                  payload = payload:gsub("-", "+"):gsub("_", "/")
                  local decoded_json = ngx.decode_base64(payload)
                  if decoded_json then
                    local cjson = require "cjson.safe"
                    local claims = cjson.decode(decoded_json)
                    if claims then
                      if claims.userId then
                        kong.service.request.set_header("X-User-Id", tostring(claims.userId))
                      end
                      if claims.sub then
                        kong.service.request.set_header("X-Username", claims.sub)
                      end
                    end
                  end
                end
              end


  - name: auth-service
    url: http://auth-service:9898
    routes:
      - name: auth-route
        paths:
          - /auth/v1/login
          - /auth/v1/signup
          - /auth/v1/validate
          - /auth/v1/refreshToken
        strip_path: false
